{% macro menu_tool_fields(nav_pages) %}
<label class="cms-menu-style-label">Style
  <select name="menu_style" class="cms-menu-style-select">
    <option value="plain">Plain links</option>
    <option value="buttons">Buttons</option>
    <option value="dropdown">Dropdown (with submenus)</option>
  </select>
</label>
{% for p in nav_pages %}
<div class="cms-menu-page-row">
  <label class="cms-menu-page-check"><input type="checkbox" name="page_ids" value="{{ p.id }}"> {{ p.title }}</label>
  <label class="cms-menu-parent-row" hidden>nested under
    <select name="parent_{{ p.id }}">
      <option value="">Top level</option>
      {% for other in nav_pages if other.id != p.id %}
      <option value="{{ other.id }}">{{ other.title }}</option>
      {% endfor %}
    </select>
  </label>
</div>
{% endfor %}
{% endmacro %}
