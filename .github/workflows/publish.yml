#  Builds the image and publishes it to this repository's own registry, so
#  a host does not have to compile one. Two architectures, because the
#  cheap VPS a small site runs on is as likely to be arm64 as amd64 and
#  discovering that on the host is discovering it too late.
#
#  The package is PRIVATE, like the repository. A host pulls it with a
#  token — see README.md, "Run the published image".
name: Publish the image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  #  A second push while the first is still building arm64 under emulation
  #  should replace it, not queue behind it.
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      #  arm64 is built by emulation on an amd64 runner. Slower than
      #  native, and it is the difference between one image that runs
      #  anywhere and two half-answers.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          #  Lowercased for us — a registry will not take gmsCms as written.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=gmsCms
            org.opencontainers.image.description=A self-hosted CMS and template manager, edited on the page.

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          #  So the running app can say which commit it is (app/version.py)
          #  -- the one question "is prod behind?" needs answered.
          build-args: |
            APP_BUILD=${{ github.sha }}
          #  The template-zip stage rebuilds whenever a template changes
          #  and is the slow half of the build; caching it between runs is
          #  most of the difference between a four-minute publish and a
          #  fifteen-minute one.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what was published
        run: |
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
